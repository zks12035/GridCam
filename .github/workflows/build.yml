name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk GridCam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GridCam-apk
          path: GridCam.apk
      - name: Publish release (the app updates itself from here)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Grid Cam build ${{ github.run_number }}
          files: GridCam.apk
          make_latest: true
